<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Size | Huffman Text Compression</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="app-header">
        <div class="brand">
            <span class="brand-mark">0</span>
            <h1>Zero-Size</h1>
        </div>
        <p class="tagline">Huffman-based text compression, visualized.</p>
    </header>

    <main class="app-main">
        <section class="panel controls-panel">
            <label class="dropzone" id="dropzone" for="uploadedFile">
                <span id="dropzoneLabel">Drop a text file here or click to browse</span>
                <input type="file" id="uploadedFile" accept=".txt" hidden>
            </label>

            <div class="actions">
                <button type="button" class="btn btn-encode" id="encode">Encode</button>
                <button type="button" class="btn btn-decode" id="decode">Decode</button>
            </div>

            <div class="stats" id="stats">
                <p class="placeholder">Upload a file and choose Encode or Decode to see stats here.</p>
            </div>
        </section>

        <section class="panel tree-panel">
            <h2>Huffman Tree</h2>
            <div class="tree-container" id="treearea">
                <p class="placeholder">The generated tree will be visualized here.</p>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>Built with vanilla JS &mdash; no frameworks, no dependencies.</p>
    </footer>

    <script src="heap.js"></script>
    <script src="huffman.js" type="module"></script>
    <script src="treeView.js" type="module"></script>
    <script src="script.js" type="module"></script>
</body>

</html>
